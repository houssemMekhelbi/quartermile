# Quarter Mile day tmux. Status at the bottom on the panel colour. Plates are plain
# rectangles and every plate ends in a chequer: the quadrant glyph U+259A
# printed twice in the plate's colour over the colour that follows it (no
# slants, no Powerline glyphs; the glyph is a block element, so foot draws it
# itself). The session name is a plate in the stripe colour; the current
# window sits on the stripes (a double underline; terminals without styled
# underlines show a single one); the clock is a chrome block opened by the
# mirrored chequer U+259E. Activity in another window is the countdown amber.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#F8F6F0,fg=#5A5F66"

set -g status-left-length 44
set -g status-left "#[bg=#15171A,fg=#F2EFE6] #{=/24/…:session_name} #[bg=#F8F6F0,fg=#15171A]▚▚ "

set -g status-right-length 40
set -g status-right "#[bg=#F8F6F0,fg=#5A5F66]▞▞#[bg=#5A5F66,fg=#F8F6F0] %H:%M "

# Windows are plain index:name. The current one is bold in the text colour on
# a double underline, others muted, activity in amber.
set -g window-status-separator ""
set -g window-status-format "#[fg=#5A5F66] #{?window_activity_flag,#[fg=#8A5200],}#I:#W "
set -g window-status-current-format "#[fg=#15171A,bold] #[double-underscore]#I:#W#[nounderscore] #[nobold]"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active chrome, inactive hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#cfcabc"
set -g pane-active-border-style "fg=#5a5f66"
set -g pane-border-indicators off

set -g message-style "bg=#E4DFD1,fg=#15171A"
set -g message-command-style "bg=#E4DFD1,fg=#145A9C"
set -g mode-style "bg=#145A9C,fg=#F8F6F0"
set -g copy-mode-match-style "bg=#E4DFD1,fg=#145A9C,underscore"
set -g copy-mode-current-match-style "bg=#15171A,fg=#F2EFE6"
set -g menu-style "bg=#F2EFE6,fg=#5A5F66"
set -g menu-selected-style "bg=#145A9C,fg=#F8F6F0"
set -g menu-border-style "fg=#5A5F66"
set -g menu-border-lines single
set -g popup-border-style "fg=#5A5F66"
set -g popup-border-lines single
set -g display-panes-colour "#CFCABC"
set -g display-panes-active-colour "#15171A"
set -g clock-mode-colour "#15171A"
