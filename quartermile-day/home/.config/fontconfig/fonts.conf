<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Quarter Mile type (the same in both variants):
       display    Ultra            + Lalezar (Arabic): lock clock, banner names
       script     Yellowtail       the lock line only
       sign       Bungee           caps, 13px and up only: the banner tag
       interface  Libre Franklin   + IBM Plex Sans Arabic; 600 caps for the bar labels
       timeslip   Courier Prime    + Source Code Pro: bar values, launcher, yawm, banner details, lock date
       terminal   Source Code Pro  + IBM Plex Sans Arabic, JetBrains Mono Nerd Font
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. Courier Prime has no ● ○ ‖ ▚; Source Code Pro
     has them at the same advance width (0.6 em). -->
<fontconfig>
  <alias binding="same">
    <family>Libre Franklin</family>
    <accept><family>IBM Plex Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Ultra</family>
    <accept><family>Lalezar</family></accept>
  </alias>
  <alias binding="same">
    <family>Bungee</family>
    <accept><family>Libre Franklin</family><family>IBM Plex Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Courier Prime</family>
    <accept><family>Source Code Pro</family><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>
  <alias binding="same">
    <family>Source Code Pro</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Libre Franklin</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Libre Franklin</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Source Code Pro</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
