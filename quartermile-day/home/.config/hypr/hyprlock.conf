# Quarter Mile day lock screen. Left: the clock as an elapsed time on a scoreboard (a
# black board in a chrome frame with its legends and a chequer band:
# lock-board.png; the time in Ultra and the date on its dotted leader are
# labels on top of it), the password plate (lock-field.png under a transparent
# field: a staged bulb at the left, the stripes across its right end) and the
# line in Yellowtail. Right: the starting tree (lock-tree.png) standing on the
# wallpaper's stripes, staged lights lit: the screen is staged, not running.
# hyprlock draws no chequer and no gradient frame, so those are images from
# ~/.config/hypr/quartermile-day/build-art.py. The field reports through its text:
# "verifying" in amber (the countdown), the failure in red (the foul).
# No username. Lines: ~/.config/hypr/quartermile-day/sayings.txt.
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/quartermile-day/wallpaper.png
    color = rgb(F2EFE6)
    blur_passes = 2
    blur_size = 3
    brightness = 0.80
    vibrancy = 0
    noise = 0.01
}

# ---- left: the scoreboard, the field, the line ----------------------------

image {
    monitor =
    path = ~/.config/hypr/quartermile-day/lock-board.png
    size = 430
    rounding = 0
    border_size = 0
    position = 160, -236
    halign = left
    valign = top
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgba(F3F1EAFF)
    font_size = 172
    font_family = Ultra
    position = -350, 118
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] $HOME/.local/bin/quartermile-lock-saying date
    color = rgba(F3F1EAFF)
    font_size = 16
    font_family = Courier Prime
    position = -350, -84
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = ~/.config/hypr/quartermile-day/lock-field.png
    size = 56
    rounding = 0
    border_size = 0
    position = 160, -698
    halign = left
    valign = top
    zindex = 1
}

input-field {
    monitor =
    size = 520, 56
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(15171AFF)
    font_family = Courier Prime
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = 4
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##5A5F66">password</span>
    fail_text = <span foreground="##B3241C">$FAIL</span>
    check_text = <span foreground="##8A5200">verifying</span>
    zindex = 2
    position = 160, -698
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/quartermile-lock-saying
    color = rgba(15171AFF)
    font_size = 34
    font_family = Yellowtail
    position = 164, -776
    halign = left
    valign = top
    zindex = 1
}

# ---- right: the tree, on the wallpaper's stripes ---------------------------

image {
    monitor =
    path = ~/.config/hypr/quartermile-day/lock-tree.png
    size = 260
    rounding = 0
    border_size = 0
    position = 1200, -170
    halign = left
    valign = top
    zindex = 0
}
