# Quarter Mile day launcher for fuzzel (unused: SUPER+D runs quartermile-launcher, foot + fzf).

[main]
font=Libre Franklin:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=F8F6F0F7
text=5A5F66FF
message=5A5F66FF
prompt=8A5200FF
placeholder=676C73FF
input=15171AFF
match=5A5F66FF
selection=E4DFD1FF
selection-text=15171AFF
selection-match=8A5200FF
counter=145A9CFF
border=5A5F66FF

[border]
width=1
radius=3
