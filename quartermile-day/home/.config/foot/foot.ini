# Quarter Mile day terminal. Night at 96% with compositor blur behind it;
# the cursor in the text colour (the attention colour is a status here).
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Source Code Pro:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.96
blur=yes
background=F2EFE6
foreground=24272C
cursor=F2EFE6 15171A
regular0=15171A
regular1=B3241C
regular2=1A6E31
regular3=8A5200
regular4=145A9C
regular5=6A3FA0
regular6=12687A
regular7=5A5F66
bright0=676C73
bright1=96190F
bright2=125A26
bright3=6E4100
bright4=0F4C86
bright5=573088
bright6=0E5565
bright7=15171A
selection-foreground=15171A
selection-background=E4DFD1
jump-labels=F2EFE6 8A5200
scrollback-indicator=F2EFE6 5A5F66
search-box-no-match=F2EFE6 B3241C
search-box-match=F2EFE6 8A5200
urls=145A9C

