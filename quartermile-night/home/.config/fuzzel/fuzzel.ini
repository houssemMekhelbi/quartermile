# Quarter Mile night launcher for fuzzel (unused: SUPER+D runs quartermile-launcher, foot + fzf).

[main]
font=Libre Franklin:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=17191CF7
text=9AA0A8FF
message=9AA0A8FF
prompt=FFB02EFF
placeholder=7A828CFF
input=F3F1EAFF
match=B9BEC6FF
selection=21242AFF
selection-text=F3F1EAFF
selection-match=FFB02EFF
counter=5AA9F0FF
border=B9BEC6FF

[border]
width=1
radius=3
