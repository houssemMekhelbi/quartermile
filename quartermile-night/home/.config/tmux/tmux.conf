# Quarter Mile night tmux. Status at the bottom on the panel colour. Plates are plain
# rectangles and every plate ends in a chequer: the quadrant glyph U+259A
# printed twice in the plate's colour over the colour that follows it (no
# slants, no Powerline glyphs; the glyph is a block element, so foot draws it
# itself). The session name is a plate in the stripe colour; the current
# window sits on the stripes (a double underline; terminals without styled
# underlines show a single one); the clock is a chrome block opened by the
# mirrored chequer U+259E. Activity in another window is the countdown amber.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#17191C,fg=#9AA0A8"

set -g status-left-length 44
set -g status-left "#[bg=#F3F1EA,fg=#101113] #{=/24/…:session_name} #[bg=#17191C,fg=#F3F1EA]▚▚ "

set -g status-right-length 40
set -g status-right "#[bg=#17191C,fg=#B9BEC6]▞▞#[bg=#B9BEC6,fg=#101113] %H:%M "

# Windows are plain index:name. The current one is bold in the text colour on
# a double underline, others muted, activity in amber.
set -g window-status-separator ""
set -g window-status-format "#[fg=#9AA0A8] #{?window_activity_flag,#[fg=#FFB02E],}#I:#W "
set -g window-status-current-format "#[fg=#F3F1EA,bold] #[double-underscore]#I:#W#[nounderscore] #[nobold]"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active chrome, inactive hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#31353c"
set -g pane-active-border-style "fg=#b9bec6"
set -g pane-border-indicators off

set -g message-style "bg=#21242A,fg=#F3F1EA"
set -g message-command-style "bg=#21242A,fg=#5AA9F0"
set -g mode-style "bg=#145A9C,fg=#F3F1EA"
set -g copy-mode-match-style "bg=#21242A,fg=#5AA9F0,underscore"
set -g copy-mode-current-match-style "bg=#F3F1EA,fg=#101113"
set -g menu-style "bg=#101113,fg=#9AA0A8"
set -g menu-selected-style "bg=#145A9C,fg=#F3F1EA"
set -g menu-border-style "fg=#B9BEC6"
set -g menu-border-lines single
set -g popup-border-style "fg=#B9BEC6"
set -g popup-border-lines single
set -g display-panes-colour "#31353C"
set -g display-panes-active-colour "#F3F1EA"
set -g clock-mode-colour "#F3F1EA"
