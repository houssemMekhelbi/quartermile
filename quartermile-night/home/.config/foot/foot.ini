# Quarter Mile night terminal. Night at 93% with compositor blur behind it;
# the cursor in the text colour (the attention colour is a status here).
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Source Code Pro:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.93
blur=yes
background=101113
foreground=D9D8D2
cursor=101113 F3F1EA
regular0=17191C
regular1=FF5348
regular2=35C759
regular3=FFB02E
regular4=5AA9F0
regular5=B9A3F0
regular6=6CC7D6
regular7=B9BEC6
bright0=7A828C
bright1=FF7A70
bright2=6BDB87
bright3=FFC766
bright4=8CC4F5
bright5=CDBCF6
bright6=97DAE5
bright7=F3F1EA
selection-foreground=F3F1EA
selection-background=21242A
jump-labels=101113 FFB02E
scrollback-indicator=101113 B9BEC6
search-box-no-match=101113 FF5348
search-box-match=101113 FFB02E
urls=5AA9F0

